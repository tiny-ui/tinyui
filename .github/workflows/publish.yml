name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:   # npm job --dry-run only: preview what a tag push would publish (no Maven, no release)

jobs:
  # Nothing goes to Maven Central or npm (both irrevocable) until the version number agrees everywhere:
  # the three packages, their VERSION exports — core's is also what the Kotlin library reports as TinyUI.version
  # and is compiled into the runtime bytecode the library embeds — and, on a tag push, the tag itself
  # (the Maven coordinate comes from the tag).
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check "${{ github.event_name == 'push' && github.ref_name || '' }}"
      - run: pnpm build
      - run: pnpm runtime:check

  maven:
    needs: versions
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release-notes.ts diffs against the previous tag
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: quickjs-kmp host JNI for Android host tests (qjsc-kmp comes from the npm package)
        run: |
          version=$(sed -n 's/^quickjsKmp = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          git clone --depth 1 --branch "$version" https://github.com/HarlonWang/quickjs-kmp.git "$RUNNER_TEMP/quickjs-kmp"
          (cd "$RUNNER_TEMP/quickjs-kmp" && ./gradlew :library:buildNativeHostJni --no-daemon)
          echo "TINYUI_QUICKJS_HOST_JNI=$RUNNER_TEMP/quickjs-kmp/library/build/native/host-jni/lib" >> "$GITHUB_ENV"
      - run: ./gradlew :compose:testAndroidHostTest :compose:apiCheck --no-daemon
      - name: Publish to Maven Central
        run: ./gradlew :compose:publishAndReleaseToMavenCentral :updates:publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      # 「升级须知」「要点」由模型起草，排在 GitHub 生成的 PR 列表之前；没有 key 或调用失败时 ai-notes.md 为空，照旧只发 PR 列表
      - name: Draft release notes
        run: node packages/cli/scripts/release-notes.ts "$GITHUB_REF_NAME" > ai-notes.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: |
          if [ -s ai-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file ai-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # npm trusted publishing (OIDC): no token, provenance attached. Each package's Trusted Publisher
  # on npmjs.com is bound to this workflow's filename, so renaming publish.yml breaks it.
  npm:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # bundles npm >= 11.5.1, required for OIDC
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish -r --access public --no-git-checks ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
